name: Publish MyDayFit Evolution image

on:
  push:
    branches:
      - agent/fix-whatsapp-connection-state
    paths:
      - .github/workflows/publish-mydayfit-image.yml
      - Dockerfile
      - package.json
      - package-lock.json
      - src/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Linux AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mydayfit/evolution-api:2.3.7-mydayfit.1
          labels: |
            org.opencontainers.image.source=https://github.com/mydayfit/evolution-api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
